<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
        color: #1d1d1f;
        background: #ffffff;
      }

      body {
        margin: 0;
        line-height: 1.8;
      }

      main {
        width: min(760px, calc(100% - 40px));
        margin: 0 auto;
        padding: 56px 0 80px;
      }

      h1 {
        margin: 0 0 32px;
        font-size: 2rem;
        line-height: 1.4;
      }

      h2 {
        margin: 40px 0 12px;
        font-size: 1.35rem;
        line-height: 1.5;
      }

      p,
      ul,
      ol {
        margin: 0 0 16px;
      }

      a {
        color: #0066cc;
      }

      @media (max-width: 600px) {
        main {
          width: min(100% - 32px, 760px);
          padding-top: 32px;
        }

        h1 {
          font-size: 1.65rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      {{ content }}
    </main>
  </body>
</html>
